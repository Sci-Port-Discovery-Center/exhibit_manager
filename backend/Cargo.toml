[package]
name = "exhibit_manager_backend"
version = "0.1.5"
edition = "2021"

[dependencies]
chrono = "0.4.45"
dotenvy = "0.15.7"
env_logger = "0.11.11"
log = "0.4.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }
rocket = { version = "0.5.2", features = ["json"] }
rocket_cors = "0.6.0"
serde = "1.0.229"
thiserror = "2.0.21"
urlencoding = "2.1.3"
validator = { version = "0.21.0", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
base64 = "0.23.1"
